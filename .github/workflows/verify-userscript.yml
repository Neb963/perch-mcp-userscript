name: Verify Perch MCP userscript

on:
  pull_request:
    paths:
      - "apps/userscript/**"
      - "apps/gateway/**"
      - "packages/**"
      - "tests/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/verify-userscript.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perch-mcp-userscript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
      PERCH_REQUIRE_CLEAN_ARTIFACT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Static typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: timeout --signal=TERM --kill-after=10s 240s npm test
      - name: Build userscript and Worker package
        run: npm run build
      - name: Verify release package hashes
        run: npm run verify:artifacts
      - name: Cloudflare Worker dry-run (no deployment)
        run: npx wrangler deploy --dry-run --config apps/gateway/wrangler.jsonc
      - name: Publish source snapshot
        run: git archive --format=zip --output=dist/perch-mcp-source.zip HEAD
      - name: Publish tested installer
        uses: actions/upload-artifact@v4
        with:
          name: perch-mcp-userscript-tested
          path: |
            dist/perch-mcp-candidate.zip
            dist/RELEASE.json
            dist/OPERATOR-ACCEPTANCE.md
            dist/perch-mcp.user.txt
            dist/perch-mcp-source.zip
            dist/perch-mcp.user.js
            dist/perch-mcp-cloudflare.zip
            dist/SHA256SUMS.txt
            dist/DOWNLOAD-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
